name: Build GerFrota APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Executar script Python
      run: |
        echo "s" | python3 criar_gerfrota_fretes.py
        echo ""
        echo "=== Arquivos gerados ==="
        find GerFrotaFretesApp -type f | head -30

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Criar Gradle Wrapper
      working-directory: GerFrotaFretesApp
      run: |
        mkdir -p gradle/wrapper

        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"

        cat > gradlew << 'GRADLEW'
        #!/bin/sh
        APP_HOME="$(cd "$(dirname "$0")" && pwd)"
        CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
        exec java -Xmx2048m -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
        GRADLEW
        chmod +x gradlew

        ls -la gradle/wrapper/
        ls -la gradlew

    - name: Compilar APK
      working-directory: GerFrotaFretesApp
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Verificar APK
      run: |
        ls -lh GerFrotaFretesApp/app/build/outputs/apk/debug/

    - name: Enviar APK como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GerFrota-Fretes-APK
        path: GerFrotaFretesApp/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
