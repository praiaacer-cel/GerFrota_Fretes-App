name: Build GerFrota APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Gerar projeto com script Python
      run: |
        echo "s" | python3 criar_gerfrota_fretes.py
        echo "✅ Projeto gerado com sucesso"

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Gerar Gradle Wrapper
      working-directory: GerFrotaFretesApp
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    - name: Build APK Debug
      working-directory: GerFrotaFretesApp
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload do APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: GerFrota-Fretes-APK
        path: GerFrotaFretesApp/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error

    - name: Resumo do Build
      if: success()
      run: |
        echo "✅ BUILD CONCLUÍDO COM SUCESSO!"
        echo "📦 APK gerado: app-debug.apk"
        echo "📥 Download em: Actions > [esta execução] > Artifacts"
