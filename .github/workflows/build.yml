name: Build GerFrota APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Gerar projeto com script Python
      run: |
        echo "s" | python3 criar_gerfrota_fretes.py
        ls -la GerFrotaFretesApp/
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Criar Gradle Wrapper
      working-directory: GerFrotaFretesApp
      run: |
        # Criar estrutura
        mkdir -p gradle/wrapper
        
        # gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Baixar gradle-wrapper.jar oficial
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
        
        # Criar gradlew (script Unix)
        cat > gradlew << 'GRADLEW'
        #!/bin/sh
        APP_HOME="$(cd "$(dirname "$0")" && pwd)"
        CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
        exec java -Xmx2048m -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
        GRADLEW
        chmod +x gradlew
        
        # Verificar
        ls -la gradle/wrapper/
        ls -la gradlew
    
    - name: Build APK
      working-directory: GerFrotaFretesApp
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace
    
    - name: Verificar APK
      run: |
        ls -lh GerFrotaFretesApp/app/build/outputs/apk/debug/
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GerFrota-Fretes-APK
        path: GerFrotaFretesApp/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
