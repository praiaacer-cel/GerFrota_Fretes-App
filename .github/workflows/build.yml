name: Build GerFrota APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate project with Python script
      run: |
        echo "s" | python3 criar_gerfrota_fretes.py

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Gradle Wrapper
      working-directory: GerFrotaFretesApp
      run: gradle wrapper --gradle-version 8.4

    - name: Build APK Debug
      working-directory: GerFrotaFretesApp
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: GerFrota-Fretes-APK
        path: GerFrotaFretesApp/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
