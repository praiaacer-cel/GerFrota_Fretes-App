name: Build GerFrota APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate project with Python script
      run: |
        echo "s" | python3 criar_gerfrota_fretes.py
        echo ""
        echo "=== Generated files ==="
        ls -la GerFrotaFretesApp/ || echo "Directory not found"

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Gradle Wrapper
      working-directory: GerFrotaFretesApp
      run: |
        echo "Creating Gradle Wrapper..."
        mkdir -p gradle/wrapper

        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" || {
            echo "Failed to download gradle-wrapper.jar"
            exit 1
          }

        cat > gradlew << 'GRADLEW'
        #!/bin/sh
        APP_HOME="$(cd "$(dirname "$0")" && pwd)"
        CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
        exec java -Xmx2048m -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
        GRADLEW
        chmod +x gradlew

        ls -la gradle/wrapper/
        ls -la gradlew

    - name: Build APK Debug
      working-directory: GerFrotaFretesApp
      run: |
        echo "Building APK..."
        ./gradlew assembleDebug --no-daemon --stacktrace || {
          echo "Build failed!"
          exit 1
        }

    - name: Verify APK
      run: |
        echo "Verifying APK..."
        ls -lh GerFrotaFretesApp/app/build/outputs/apk/debug/ || {
          echo "APK not found!"
          exit 1
        }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GerFrota-Fretes-APK
        path: GerFrotaFretesApp/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error

    - name: Build Summary
      if: success()
      run: |
        echo "========================================"
        echo "BUILD SUCCESSFUL!"
        echo "========================================"
        echo "APK generated: app-debug.apk"
        echo "Download in: Actions > [this run] > Artifacts"
        echo "========================================"
